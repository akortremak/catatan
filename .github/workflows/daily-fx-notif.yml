name: Daily FX Notification

on:
  schedule:
  # Berjalan setiap hari pukul 00:30 UTC (07:30 WIB)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  notify-fx:
    runs-on: ubuntu-latest
    steps:
      - name: Send JPY & SGD Update to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e '
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
              console.error("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID");
              process.exit(1);
            }

            function isoDaysAgo(days) {
              const d = new Date();
              d.setUTCDate(d.getUTCDate() - days);
              return d.toISOString().split("T")[0];
            }

            async function fetchJsonWithTimeout(url, timeoutMs = 8000) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), timeoutMs);
              try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
              } finally {
                clearTimeout(timer);
              }
            }

            async function fetchFawazIdr(currencyLower, tag) {
              const urls = [
                `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/${currencyLower}.json`,
                `https://${tag}.currency-api.pages.dev/v1/currencies/${currencyLower}.json`
              ];
              for (const url of urls) {
                try {
                  const data = await fetchJsonWithTimeout(url);
                  const val = data?.[currencyLower]?.idr;
                  if (typeof val === "number" && val > 0) return val;
                } catch (_) {}
              }
              return null;
            }

            async function fetchOpenFxLatest() {
              const data = await fetchJsonWithTimeout("https://open.er-api.com/v6/latest/IDR");
              const rates = data?.rates;
              if (!rates?.JPY || !rates?.SGD) throw new Error("Invalid OpenFX rates");
              return {
                jpy: 1 / rates.JPY,
                sgd: 1 / rates.SGD
              };
            }

            function formatRp(val) {
              if (typeof val !== "number" || Number.isNaN(val)) return "Rp —";
              const decimals = val < 500 ? 2 : 0;
              return "Rp " + val.toLocaleString("id-ID", {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
              });
            }

            function formatChange(current, base) {
              if (!base || base <= 0) return "• 0,00%";
              const pct = ((current - base) / base) * 100;
              const str = Math.abs(pct).toFixed(2).replace(".", ",");
              if (pct > 0.005) return `▲ +${str}%`;
              if (pct < -0.005) return `▼ -${str}%`;
              return "• 0,00%";
            }

            (async () => {
              let [jpyNow, sgdNow, jpyPrev1d, sgdPrev1d, jpyBase1y, sgdBase1y] = await Promise.all([
                fetchFawazIdr("jpy", "latest"),
                fetchFawazIdr("sgd", "latest"),
                fetchFawazIdr("jpy", isoDaysAgo(1)),
                fetchFawazIdr("sgd", isoDaysAgo(1)),
                fetchFawazIdr("jpy", isoDaysAgo(365)),
                fetchFawazIdr("sgd", isoDaysAgo(365))
              ]);

              if (jpyNow === null || sgdNow === null) {
                const fallback = await fetchOpenFxLatest();
                if (jpyNow === null) jpyNow = fallback.jpy;
                if (sgdNow === null) sgdNow = fallback.sgd;
              }

              const safeJpyPrev = jpyPrev1d || jpyNow;
              const safeSgdPrev = sgdPrev1d || sgdNow;
              const safeJpy1y = jpyBase1y || safeJpyPrev;
              const safeSgd1y = sgdBase1y || safeSgdPrev;

              const nowWib = new Date().toLocaleString("id-ID", {
                timeZone: "Asia/Jakarta",
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              });

              const text = [
                "📊 *Update Pasar Uang — Catatan*",
                `🕒 ${nowWib} WIB`,
                "",
                `🇯🇵 1 JPY = ${formatRp(jpyNow)} (${formatChange(jpyNow, safeJpyPrev)} 1HR | ${formatChange(jpyNow, safeJpy1y)} 1TH)`,
                `🇸🇬 1 SGD = ${formatRp(sgdNow)} (${formatChange(sgdNow, safeSgdPrev)} 1HR | ${formatChange(sgdNow, safeSgd1y)} 1TH)`,
                "",
                "🔗 [Buka Aplikasi Catatan](https://akortremak.github.io/catatan/)"
              ].join("\n");

              const tgRes = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  chat_id: chatId,
                  text,
                  parse_mode: "Markdown",
                  disable_web_page_preview: true
                })
              });

              if (!tgRes.ok) {
                const errBody = await tgRes.text();
                console.error("Telegram error:", errBody);
                process.exit(1);
              }
              console.log("Telegram FX notification sent successfully.");
            })();
          '
